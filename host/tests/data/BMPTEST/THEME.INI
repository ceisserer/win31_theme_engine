; Test theme for bitmap ops (host/tests). Inherits everything else from WIN95.
[Theme]
Name=Bitmap test
Format=1
Base=WIN95

[Colors]
Accent=255,0,0

[Recolor]
255,255,0=Sys:BtnFace

[PushButton.Normal]
Op=Bitmap
Image=BUTTON.BMP
Sizing=NineGrid
Margins=2,2,2,2
Transparent=255,0,255
Recolor=1

[PushButton.Pressed]
Op=Bitmap
Image=BUTTON.BMP
Sizing=Stretch

[Dialog]
Op=Bitmap
Image=TILE.BMP
Sizing=Tile

[Caption.Active]
Op=Gradient
From=0,0,128
To=16,132,208
Direction=Horizontal
Bands=64
