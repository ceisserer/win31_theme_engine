; Win98 - Classic95 with the Windows 98 two-colour caption gradient.
; Shows how little a derived theme needs: everything else comes from Base=.

[Theme]
Name=Redmond 98
Author=Retheme16 project
Version=1.0
Format=1
Base=WIN95

[Colors]
ActiveEnd=16,132,208
InactiveEnd=192,192,192

[CaptionBand]
Op=Fill
Color=Sys:BtnFace

[Bar98Active]
Op=Gradient
From=Sys:ActiveCaption
To=ActiveEnd
Direction=Horizontal
Bands=64
Inset=0,0,0,1

[Bar98Inactive]
Op=Gradient
From=Sys:InactiveCaption
To=InactiveEnd
Direction=Horizontal
Bands=64
Inset=0,0,0,1

[Caption.Active]
Layers=CaptionBand,Bar98Active

[Caption.Inactive]
Layers=CaptionBand,Bar98Inactive
