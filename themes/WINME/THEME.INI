; RedmondME - the beige look of Windows ME: its standard colour scheme set
; as system colours while the theme is active ([SysColors]), and the
; two-colour caption gradient of Redmond 98 in the ME colours.

[Theme]
Name=Redmond ME
Author=Retheme16 project
Version=1.0
Format=1
Base=WIN95

; the engine sets these while the theme runs and restores the old values
; when it stops; nothing is written to WIN.INI
[SysColors]
Scrollbar=212,208,200
Background=58,110,165
ActiveCaption=10,36,106
InactiveCaption=128,128,128
Menu=212,208,200
Window=255,255,255
WindowFrame=0,0,0
MenuText=0,0,0
WindowText=0,0,0
CaptionText=255,255,255
ActiveBorder=212,208,200
InactiveBorder=212,208,200
AppWorkspace=128,128,128
Highlight=10,36,106
HighlightText=255,255,255
BtnFace=212,208,200
BtnShadow=128,128,128
GrayText=128,128,128
BtnText=0,0,0
InactiveCaptionText=212,208,200
BtnHighlight=255,255,255
3DDkShadow=64,64,64
3DLight=212,208,200

[Colors]
ActiveEnd=166,202,240
InactiveEnd=192,192,192

[CaptionBand]
Op=Fill
Color=Sys:BtnFace

[BarMEActive]
Op=Gradient
From=Sys:ActiveCaption
To=ActiveEnd
Direction=Horizontal
Bands=64
Inset=0,0,0,1

[BarMEInactive]
Op=Gradient
From=Sys:InactiveCaption
To=InactiveEnd
Direction=Horizontal
Bands=64
Inset=0,0,0,1

[Caption.Active]
Layers=CaptionBand,BarMEActive

[Caption.Inactive]
Layers=CaptionBand,BarMEInactive
