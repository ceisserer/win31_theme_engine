; Cupertino Platinum - the grey "Platinum" look of the classic Macintosh
; system of the late 1990s: a light grey caption with six grooves and the
; title centred in a gap between them, the close box on the left, the zoom
; and collapse boxes on the right (maximise and minimise), rounded push
; buttons with a gradient (the default button in a thick ring), lavender
; scroll bar thumbs with a grip, light grey menus with a dark blue
; highlight, and the Platinum greys as system colours.
;
; Made for high-colour displays (15/16/24 bit), but the greys also map well
; to 256 and 16 colours.
;
; The theme is self-contained (no Base=), so only one theme is held in
; memory. Its bitmaps are made by tools/gen_os9.py; keep the colours there
; in step with this file.

[Theme]
Name=Cupertino Platinum
; where theme lists put it (Setup, THEMES.EXE)
Order=60
Author=Retheme16 project
Version=1.0
Format=1
ColorMode=Fixed

; NewShell16 reads this section: Style=OS9 draws its taskbar and Start menu
; in the Platinum style while this theme is active. The engine itself
; ignores it.
[Shell]
Style=OS9

[Metrics]
CaptionButtonWidth=17
CaptionButtonHeight=17
CaptionButtonGap=0
CaptionIconSize=16
TitlePadding=4
; the close box on the left; the zoom box (Max) and the collapse box (Min)
; on the right
Layout=Close,Title,Max,Min

[SysColors]
Scrollbar=170,170,170
Background=102,102,153
ActiveCaption=221,221,221
InactiveCaption=221,221,221
Menu=221,221,221
Window=255,255,255
WindowFrame=34,34,34
MenuText=0,0,0
WindowText=0,0,0
CaptionText=0,0,0
ActiveBorder=221,221,221
InactiveBorder=221,221,221
AppWorkspace=187,187,187
Highlight=51,51,153
HighlightText=255,255,255
BtnFace=221,221,221
BtnShadow=153,153,153
GrayText=136,136,136
BtnText=0,0,0
InactiveCaptionText=136,136,136
BtnHighlight=255,255,255
3DDkShadow=34,34,34
3DLight=238,238,238

[Colors]
Face=Sys:BtnFace
Text=Sys:BtnText
Gray=136,136,136
White=255,255,255
Light=238,238,238
Shadow=153,153,153
Outline=34,34,34
MenuHi=51,51,153
Arrow=0,0,0
ArrowOff=170,170,170
IconShadow=0,0,0

[Fonts]
Caption=Arial,9,700
Menu=MS Sans Serif,8,700
Controls=MS Sans Serif,8,400
IconTitle=MS Sans Serif,8,400

; ---- frame and caption: a raised grey frame with a dark outline; the
; active caption has six grooves, with a gap for the title

[Frame.Active]
Op=Bitmap
Image=FRAME.BMP
Source=0,0,12,12
Sizing=NineGrid
Margins=4,4,4,4

[Frame.Inactive]
Op=Bitmap
Image=FRAME.BMP
Source=12,0,12,12
Sizing=NineGrid
Margins=4,4,4,4

[DlgFrame.Active]
Layers=Frame.Active

[DlgFrame.Inactive]
Layers=Frame.Inactive

[CapFace]
Op=Fill
Color=Face

[CapStripes]
Op=Bitmap
Image=STRIPES.BMP
Sizing=Tile
Inset=3,3,3,4

[Caption.Active]
Layers=CapFace,CapStripes

[Caption.Inactive]
Layers=CapFace

; the title, centred, with a band of the face colour behind it that cuts
; the gap into the grooves
[CaptionText.Active]
Op=Text
Font=Caption
Color=Sys:CaptionText
Align=Center
Back=Face
BackPad=6

[CaptionText.Inactive]
Op=Text
Font=Caption
Color=Sys:InactiveCaptionText
Align=Center

; ---- caption boxes (CAPBTN.BMP: close, collapse, zoom, zoom (restore);
; each normal, pressed, disabled; 17x17 cells on the face colour, which
