; Slate - an original flat theme. Demonstrates bitmap parts (nine-grid with a
; colour key), fixed colours and a non-Windows caption layout (close button
; on the left). Bitmaps: tools/gen_slate.py.

[Theme]
Name=Slate
Author=Retheme16 project
Version=1.0
Format=1
Base=WIN95
ColorMode=Fixed

[Metrics]
CaptionButtonWidth=16
CaptionButtonHeight=14
CaptionButtonGap=4
Layout=Close,Gap,Icon,Title,Min,Max

[Colors]
SlateDark=44,62,80
Slate=52,73,94
SlateLight=110,132,154
Paper=236,239,241
Ink=33,37,41
Accent=41,128,185
White=255,255,255

[Fonts]
Caption=MS Sans Serif,8,700
Menu=MS Sans Serif,8,400
Controls=MS Sans Serif,8,400

; ---- frame and caption

[FrameOuter]
Op=Border
Color=SlateDark

[FrameFill]
Op=Fill
Color=Slate
Inset=1

[Frame.Active]
Layers=FrameOuter,FrameFill

[FrameFillInactive]
Op=Fill
Color=SlateLight
Inset=1

[Frame.Inactive]
Layers=FrameOuter,FrameFillInactive

[DlgFrame.Active]
Layers=FrameOuter,FrameFill

[DlgFrame.Inactive]
Layers=FrameOuter,FrameFillInactive

[Caption.Active]
Op=Gradient
From=Slate
To=SlateDark
Direction=Vertical
Bands=19

[Caption.Inactive]
Op=Fill
Color=SlateLight

[CaptionText.Active]
Op=Text
Font=Caption
Color=White
Shadow=SlateDark
Align=Left

[CaptionText.Inactive]
Op=Text
Font=Caption
Color=Paper
Align=Left

; ---- caption buttons: bitmap background + white glyph

[CapBg]
Op=Bitmap
Image=CAPBTN.BMP
Source=0,0,16,14
Transparent=255,0,255

[CapBgPressed]
Op=Bitmap
Image=CAPBTN.BMP
Source=16,0,16,14
Transparent=255,0,255

[CloseBg]
Op=Bitmap
Image=CAPBTN.BMP
Source=32,0,16,14
Transparent=255,0,255

[CloseBgPressed]
Op=Bitmap
Image=CAPBTN.BMP
Source=48,0,16,14
Transparent=255,0,255

[WClose]
Op=Glyph
Glyph=Close
Color=White

[WMin]
Op=Glyph
Glyph=Min
Color=White

[WMax]
Op=Glyph
Glyph=Max
Color=White

[WRestore]
Op=Glyph
Glyph=Restore
Color=White

[DimClose]
Op=Glyph
Glyph=Close
Color=SlateLight

[DimMin]
Op=Glyph
Glyph=Min
Color=SlateLight

[DimMax]
Op=Glyph
Glyph=Max
Color=SlateLight

[BtnClose.Normal]
Layers=CloseBg,WClose

[BtnClose.Pressed]
Layers=CloseBgPressed,WClose

[BtnClose.Disabled]
Layers=CapBg,DimClose

[BtnMin.Normal]
Layers=CapBg,WMin

[BtnMin.Pressed]
Layers=CapBgPressed,WMin

[BtnMin.Disabled]
Layers=CapBg,DimMin

[BtnMax.Normal]
Layers=CapBg,WMax

[BtnMax.Pressed]
Layers=CapBgPressed,WMax

[BtnMax.Disabled]
Layers=CapBg,DimMax

[BtnRestore.Normal]
Layers=CapBg,WRestore

[BtnRestore.Pressed]
Layers=CapBgPressed,WRestore

; ---- menus

[MenuBar]
Op=Fill
Color=Paper

[MenuBarItem.Normal]
Op=Fill
Color=Paper

[MenuBarItem.Selected]
Op=Fill
Color=Accent

[MenuBarText.Normal]
Op=Text
Font=Menu
Color=Ink
Align=Center

[MenuBarText.Selected]
Op=Text
Font=Menu
Color=White
Align=Center

[MenuOuter]
Op=Border
Color=SlateLight

[MenuBack]
Op=Fill
Color=Paper
Inset=1

[Menu]
Layers=MenuOuter,MenuBack

[MenuItem.Normal]
Op=Fill
Color=Paper

[MenuItem.Selected]
Op=Fill
Color=Accent

[MenuText.Normal]
Op=Text
Font=Menu
Color=Ink
Align=Left

[MenuText.Selected]
Op=Text
Font=Menu
Color=White
Align=Left

[MenuText.Disabled]
Op=Text
Font=Menu
Color=SlateLight
Align=Left

[MenuSeparator]
Op=Fill
Color=SlateLight
Inset=0,0,0,1

[MenuCheck.Normal]
Op=Glyph
Glyph=MenuCheck
Color=Ink

[MenuCheck.Selected]
Op=Glyph
Glyph=MenuCheck
Color=White

[MenuSubArrow.Normal]
Op=Glyph
Glyph=SubArrow
Color=Ink

[MenuSubArrow.Selected]
Op=Glyph
Glyph=SubArrow
Color=White

; ---- push buttons: nine-grid bitmap

[PushButton.Normal]
Op=Bitmap
Image=BUTTON.BMP
Source=0,0,24,22
Sizing=NineGrid
Margins=5,5,5,5
Transparent=255,0,255

[PushButton.Pressed]
Op=Bitmap
Image=BUTTON.BMP
Source=24,0,24,22
Sizing=NineGrid
Margins=5,5,5,5
Transparent=255,0,255

[PushButton.Default]
Op=Bitmap
Image=BUTTON.BMP
Source=48,0,24,22
Sizing=NineGrid
Margins=5,5,5,5
Transparent=255,0,255

[PushButtonText.Normal]
Op=Text
Font=Controls
Color=Ink
Align=Center

[PushButtonText.Pressed]
Op=Text
Font=Controls
Color=Ink
Align=Center
Offset=1,1

[PushButtonText.Disabled]
Op=Text
Font=Controls
Color=SlateLight
Align=Center

[Dialog]
Op=Fill
Color=Paper

[StaticText.Normal]
Op=Text
Font=Controls
Color=Ink

[StaticText.Disabled]
Op=Text
Font=Controls
Color=SlateLight
