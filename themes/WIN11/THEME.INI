; Redmond-11 - the light look of Windows 11: a light, slightly blue
; "Mica" caption with dark text and rounded corners, flat caption buttons
; (a red close button while pressed), white rounded push buttons with the
; blue accent on the default button, blue check boxes and radio buttons,
; thin rounded scroll bar thumbs, light menus with a rounded grey highlight
; and the Windows 11 light colours as system colours.
;
; Made for high-colour displays (15/16/24 bit, e.g. the VBE SVGA driver at
; 65536 colours): it works with 256 and 16 colours too, but GDI then maps
; the light greys to the nearest solid colours.
;
; The theme is self-contained (no Base=), so only one theme is held in
; memory. Its bitmaps (about 34 KB of files, 5 images) are made by
; tools/gen_win11.py; keep the colours there in step with this file.

[Theme]
Name=Redmond-11
Author=Retheme16 project
Version=1.0
Format=1
ColorMode=Fixed

; NewShell16 reads this section: Style=11 draws its taskbar and Start menu
; in the Windows 11 style while this theme is active. The engine itself
; ignores it.
[Shell]
Style=11

[Metrics]
CaptionButtonWidth=28
CaptionButtonHeight=18
CaptionButtonGap=0
CaptionIconSize=16
TitlePadding=5
Layout=Icon,Title,Min,Max,Close

; Windows 11 light; the old colours come back when the engine stops
[SysColors]
Scrollbar=240,240,240
Background=0,84,166
ActiveCaption=238,242,248
InactiveCaption=249,249,249
Menu=249,249,249
Window=255,255,255
WindowFrame=118,118,118
MenuText=0,0,0
WindowText=0,0,0
CaptionText=0,0,0
ActiveBorder=238,242,248
InactiveBorder=249,249,249
AppWorkspace=230,230,230
Highlight=0,120,215
HighlightText=255,255,255
BtnFace=243,243,243
BtnShadow=160,160,160
GrayText=160,160,160
BtnText=0,0,0
InactiveCaptionText=140,140,140
BtnHighlight=255,255,255
3DDkShadow=105,105,105
3DLight=227,227,227

[Colors]
