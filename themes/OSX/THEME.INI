; Cupertino Aqua - the first "Aqua" look of 2001: pinstriped windows with
; rounded top corners and the title centred, the three gel buttons on the
; left of the caption (red: close, yellow: minimise, green: zoom), gel
; push buttons (the default button blue), blue check boxes and radio
; buttons, blue gel scroll bar thumbs in a light groove, pinstriped menus
; with a blue gel highlight, and light greys as system colours.
;
; Made for high-colour displays (15/16/24 bit, e.g. the VBE SVGA driver at
; 65536 colours): it works with 256 and 16 colours too, but GDI then maps
; the gradients to the nearest solid colours.
;
; The theme is self-contained (no Base=), so only one theme is held in
; memory. Its bitmaps are made by tools/gen_osx.py; keep the colours there
; in step with this file.

[Theme]
Name=Cupertino Aqua
; where theme lists put it (Setup, THEMES.EXE)
Order=70
Author=Retheme16 project
Version=1.0
Format=1
ColorMode=Fixed

; NewShell16 reads this section: Style=OSX draws its taskbar and Start menu
; in the Aqua style (an Aqua Start button, a brushed metal bar, pinstriped
; menus) while this theme is active. The engine itself ignores it.
[Shell]
Style=OSX

[Metrics]
CaptionButtonWidth=20
CaptionButtonHeight=16
CaptionButtonGap=2
CaptionIconSize=16
TitlePadding=6
; the three buttons on the left; no icon (Alt+Space opens the system menu)
Layout=Gap,Close,Min,Max,Title

[SysColors]
Scrollbar=236,236,236
Background=58,110,190
ActiveCaption=246,246,246
InactiveCaption=250,250,250
Menu=246,246,246
Window=255,255,255
WindowFrame=128,128,128
MenuText=0,0,0
WindowText=0,0,0
CaptionText=0,0,0
ActiveBorder=246,246,246
InactiveBorder=250,250,250
AppWorkspace=210,210,210
Highlight=56,117,215
HighlightText=255,255,255
BtnFace=232,232,232
BtnShadow=160,160,160
GrayText=150,150,150
BtnText=0,0,0
InactiveCaptionText=150,150,150
BtnHighlight=255,255,255
3DDkShadow=110,110,110
3DLight=242,242,242

[Colors]
Face=Sys:BtnFace
Text=Sys:BtnText
Gray=150,150,150
White=255,255,255
Line=200,200,200
FieldBorder=128,128,128
FieldInner=200,200,200
GroupLine=190,190,190
Arrow=40,40,40
ArrowOff=170,170,170
IconShadow=0,0,0

[Fonts]
