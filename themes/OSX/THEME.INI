Menu=Arial,9,400
Controls=MS Sans Serif,8,400
IconTitle=MS Sans Serif,8,400

; the rounded top corners of the frame are yellow in FRAME.BMP and take the
; desktop colour
[Recolor]
255,255,0=Sys:Background

; ---- frame and caption: one pinstriped surface with a grey outline

[Frame.Active]
Op=Bitmap
Image=FRAME.BMP
Source=0,0,12,12
Sizing=NineGrid
Margins=4,4,4,4
Recolor=1

[Frame.Inactive]
