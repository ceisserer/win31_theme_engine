; Classic95 - the Windows 95 look, built only from procedural ops.
; This is the engine's default theme and the root of every Base= chain.
; Format reference: docs/THEME_FORMAT.md

[Theme]
Name=Redmond 95
Author=Retheme16 project
Version=1.0
Format=1
ColorMode=System

[Metrics]
CaptionButtonWidth=16
CaptionButtonHeight=14
CaptionButtonGap=2
CaptionIconSize=16
TitlePadding=2
Layout=Icon,Title,Min,Max,Gap,Close

[Colors]
Face=Sys:BtnFace
Light=Sys:3DLight
Highlight=Sys:BtnHighlight
Shadow=Sys:BtnShadow
DkShadow=Sys:3DDkShadow
Text=Sys:BtnText
Window=Sys:Window
WindowText=Sys:WindowText

[Fonts]
Caption=MS Sans Serif,8,700
Menu=MS Sans Serif,8,400
Controls=MS Sans Serif,8,400
IconTitle=MS Sans Serif,8,400

; ---------------------------------------------------------------- shared

[RaisedFace]
Op=Edge
Edge=RaisedSoft
Fill=Face

[RaisedWindowEdge]
Op=Edge
Edge=Raised
Fill=Face

[SunkenFace]
Op=Edge
Edge=SunkenSoft
Fill=Face

[FlatPressed]
Op=Edge
Edge=Flat
Fill=Face

[DarkBorder]
Op=Border
Color=DkShadow

; ---------------------------------------------------------------- frame

[FrameEdge]
Op=Edge
Edge=Raised

[FrameFillActive]
Op=Fill
Color=Sys:ActiveBorder
Inset=2

[FrameFillInactive]
Op=Fill
Color=Sys:InactiveBorder
Inset=2

[FrameFillFace]
Op=Fill
Color=Face
Inset=2

[Frame.Active]
Layers=FrameEdge,FrameFillActive

[Frame.Inactive]
Layers=FrameEdge,FrameFillInactive

[DlgFrame]
Layers=FrameEdge,FrameFillFace

; ---------------------------------------------------------------- caption

; The caption band includes the 1-pixel separator row below the bar.
[CaptionBand]
Op=Fill
Color=Face

[CaptionBarActive]
Op=Gradient
From=Sys:ActiveCaption
To=Sys:ActiveCaption
Direction=Horizontal
Inset=0,0,0,1

[CaptionBarInactive]
Op=Gradient
From=Sys:InactiveCaption
To=Sys:InactiveCaption
Direction=Horizontal
Inset=0,0,0,1

[Caption.Active]
Layers=CaptionBand,CaptionBarActive

[Caption.Inactive]
Layers=CaptionBand,CaptionBarInactive

[CaptionText.Active]
Op=Text
Font=Caption
Color=Sys:CaptionText
Align=Left

[CaptionText.Inactive]
Op=Text
Font=Caption
Color=Sys:InactiveCaptionText
Align=Left

; ---------------------------------------------------------------- caption buttons

[GlyphClose]
Op=Glyph
Glyph=Close
Color=Text

[GlyphClosePressed]
Op=Glyph
Glyph=Close
Color=Text
Offset=1,1

[GlyphCloseDisabled]
Op=Glyph
Glyph=Close
Color=Shadow
Shadow=Highlight

[GlyphMin]
Op=Glyph
Glyph=Min
Color=Text

[GlyphMinPressed]
Op=Glyph
Glyph=Min
Color=Text
Offset=1,1

[GlyphMinDisabled]
Op=Glyph
Glyph=Min
Color=Shadow
Shadow=Highlight

[GlyphMax]
Op=Glyph
Glyph=Max
Color=Text

[GlyphMaxPressed]
Op=Glyph
Glyph=Max
Color=Text
Offset=1,1

[GlyphMaxDisabled]
Op=Glyph
Glyph=Max
Color=Shadow
Shadow=Highlight

[GlyphRestore]
Op=Glyph
Glyph=Restore
Color=Text

[GlyphRestorePressed]
Op=Glyph
Glyph=Restore
Color=Text
Offset=1,1

[GlyphRestoreDisabled]
Op=Glyph
Glyph=Restore
Color=Shadow
Shadow=Highlight

[BtnClose.Normal]
Layers=RaisedFace,GlyphClose

[BtnClose.Pressed]
Layers=SunkenFace,GlyphClosePressed

[BtnClose.Disabled]
Layers=RaisedFace,GlyphCloseDisabled

[BtnMin.Normal]
Layers=RaisedFace,GlyphMin

[BtnMin.Pressed]
Layers=SunkenFace,GlyphMinPressed

[BtnMin.Disabled]
Layers=RaisedFace,GlyphMinDisabled

[BtnMax.Normal]
Layers=RaisedFace,GlyphMax

[BtnMax.Pressed]
Layers=SunkenFace,GlyphMaxPressed

[BtnMax.Disabled]
Layers=RaisedFace,GlyphMaxDisabled

[BtnRestore.Normal]
Layers=RaisedFace,GlyphRestore

[BtnRestore.Pressed]
Layers=SunkenFace,GlyphRestorePressed

[BtnRestore.Disabled]
Layers=RaisedFace,GlyphRestoreDisabled

; ---------------------------------------------------------------- menus
; Win95 menus are grey (COLOR_MENU is white in the Windows 3.1 schemes)

[MenuBar]
Op=Fill
Color=Face

[MenuBarItem.Normal]
Op=Fill
Color=Face

[MenuBarItem.Selected]
Op=Fill
Color=Sys:Highlight

[MenuBarText.Normal]
Op=Text
Font=Menu
Color=Sys:MenuText
Align=Center

[MenuBarText.Selected]
Op=Text
Font=Menu
Color=Sys:HighlightText
Align=Center

[MenuBarText.Disabled]
Op=Text
Font=Menu
Color=Shadow
Shadow=Highlight
Align=Center

[MenuBorder]
Op=Edge
Edge=Raised

[MenuBack]
Op=Fill
Color=Face
Inset=2

[Menu]
Layers=MenuBorder,MenuBack

[MenuItem.Normal]
Op=Fill
Color=Face

[MenuItem.Selected]
Op=Fill
Color=Sys:Highlight

[MenuText.Normal]
Op=Text
Font=Menu
Color=Sys:MenuText
Align=Left

[MenuText.Selected]
Op=Text
Font=Menu
Color=Sys:HighlightText
Align=Left

[MenuText.Disabled]
Op=Text
Font=Menu
Color=Shadow
Shadow=Highlight
Align=Left

[MenuSeparator]
Op=Edge
Edge=SunkenOuter

[MenuCheck.Normal]
Op=Glyph
Glyph=MenuCheck
Color=Sys:MenuText

[MenuCheck.Selected]
Op=Glyph
Glyph=MenuCheck
Color=Sys:HighlightText

[MenuCheck.Disabled]
Op=Glyph
Glyph=MenuCheck
Color=Shadow
Shadow=Highlight

[MenuSubArrow.Normal]
Op=Glyph
Glyph=SubArrow
Color=Sys:MenuText

[MenuSubArrow.Selected]
Op=Glyph
Glyph=SubArrow
Color=Sys:HighlightText

[MenuSubArrow.Disabled]
Op=Glyph
Glyph=SubArrow
Color=Shadow
Shadow=Highlight

; ---------------------------------------------------------------- push buttons

[ButtonInsetRaised]
Op=Edge
Edge=RaisedSoft
Fill=Face
Inset=1

[ButtonPressedInner]
Op=Edge
Edge=Flat
Fill=Face
Inset=1

[PushButton.Normal]
Layers=RaisedFace

[PushButton.Default]
Layers=DarkBorder,ButtonInsetRaised

[PushButton.Pressed]
Layers=DarkBorder,ButtonPressedInner

[PushButtonText.Normal]
Op=Text
Font=Controls
Color=Text
Align=Center

[PushButtonText.Pressed]
Op=Text
Font=Controls
Color=Text
Align=Center
Offset=1,1

[PushButtonText.Disabled]
Op=Text
Font=Controls
Color=Shadow
Shadow=Highlight
Align=Center

[Focus]
Op=Focus

; ---------------------------------------------------------------- check boxes

[CheckWell]
Op=Edge
Edge=Sunken
Fill=Window

[CheckWellFace]
Op=Edge
Edge=Sunken
Fill=Face

[CheckWellMixed]
Op=Layers
Layers=CheckWellFace,CheckMixedDither

[CheckMixedDither]
Op=Dither
Color=Highlight
Color2=Face
Inset=2

[CheckMark]
Op=Glyph
Glyph=Check
Color=WindowText

[CheckMarkGray]
Op=Glyph
Glyph=Check
Color=Shadow

[CheckBox.Normal]
Layers=CheckWell

[CheckBox.Pressed]
Layers=CheckWellFace

[CheckBox.Disabled]
Layers=CheckWellFace

[CheckBox.Checked]
Layers=CheckWell,CheckMark

[CheckBox.CheckedPressed]
Layers=CheckWellFace,CheckMark

[CheckBox.CheckedDisabled]
Layers=CheckWellFace,CheckMarkGray

[CheckBox.Mixed]
Layers=CheckWellMixed,CheckMarkGray

[CheckBox.MixedPressed]
Layers=CheckWellFace,CheckMarkGray

; ---------------------------------------------------------------- radio buttons

[RadioFillWindow]
Op=Glyph
Glyph=RadioFill
Color=Window

[RadioFillFace]
Op=Glyph
Glyph=RadioFill
Color=Face

[RadioOuterRing]
Op=Glyph
Glyph=RadioOuter
Color=Shadow
Color2=Highlight

[RadioInnerRing]
Op=Glyph
Glyph=RadioInner
Color=DkShadow
Color2=Light

[RadioDot]
Op=Glyph
Glyph=RadioDot
Color=WindowText

[RadioDotGray]
Op=Glyph
Glyph=RadioDot
Color=Shadow

[Radio.Normal]
Layers=RadioFillWindow,RadioOuterRing,RadioInnerRing

[Radio.Pressed]
Layers=RadioFillFace,RadioOuterRing,RadioInnerRing

[Radio.Disabled]
Layers=RadioFillFace,RadioOuterRing,RadioInnerRing

[Radio.Checked]
Layers=RadioFillWindow,RadioOuterRing,RadioInnerRing,RadioDot

[Radio.CheckedPressed]
Layers=RadioFillFace,RadioOuterRing,RadioInnerRing,RadioDot

[Radio.CheckedDisabled]
Layers=RadioFillFace,RadioOuterRing,RadioInnerRing,RadioDotGray

