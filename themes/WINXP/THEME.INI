Background=0,78,152
ActiveCaption=0,84,227
InactiveCaption=122,150,223
Menu=255,255,255
Window=255,255,255
WindowFrame=0,0,0
MenuText=0,0,0
WindowText=0,0,0
CaptionText=255,255,255
