; RedmondExperience - the blue "Luna" look of Windows XP: a blue caption with
; rounded top corners, round caption buttons (red close button), soft
; rounded push buttons, green check marks, light blue scroll bars and white
; menus, with the Luna colour scheme set as system colours.
;
; Made for high-colour displays (15/16/24 bit, e.g. the VBE SVGA driver at
; 65536 colours): it works with 256 and 16 colours too, but GDI then maps
; the gradients to the nearest solid colours.
;
; The theme is self-contained (no Base=), so only one theme is held in
; memory. Its bitmaps (about 30 KB of files, 6 images) are made by
; tools/gen_winxp.py.

[Theme]
Name=RedmondExperience
Author=Retheme16 project
Version=1.0
Format=1
ColorMode=Fixed

; NewShell16 reads this section: Style=XP draws its taskbar, Start button and
; Start menu in the same style while this theme is active. The engine
; itself ignores it.
[Shell]
Style=XP

[Metrics]
CaptionButtonWidth=16
CaptionButtonHeight=16
CaptionButtonGap=2
CaptionIconSize=16
TitlePadding=3
Layout=Icon,Title,Min,Gap,Max,Gap,Close

; the Luna colour scheme; the old colours come back when the engine stops
[SysColors]
